<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RoboKids · Aprende robótica jugando</title>
<link rel="icon" type="image/png" href="./robot.png">


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
/* ===========================================================
   RoboKids · Estilos globales (todo en un solo archivo)
   =========================================================== */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --verde:      #58CC02;
  --verde-dark: #46A302;
  --azul:       #1CB0F6;
  --azul-dark:  #1899D6;
  --amarillo:   #FFC800;
  --amarillo-dark:#E5A800;
  --rojo:       #FF4B4B;
  --rojo-dark:  #E63E3E;
  --morado:     #CE82FF;
  --morado-dark:#B563E0;
  --naranja:    #FF9600;
  --gris-100:   #F7F8FA;
  --gris-200:   #E5E5E5;
  --gris-400:   #AFAFAF;
  --gris-700:   #4B4B4B;
  --texto:      #3C3C3C;
  --blanco:     #FFFFFF;
  --radio:      18px;
}

*{ box-sizing: border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }
body{ font-family:'Nunito', sans-serif; color:var(--texto); background:var(--gris-100); }
h1,h2,h3,.titulo{ font-family:'Baloo 2', sans-serif; }
button{ font-family:inherit; cursor:pointer; border:none; }
input{ font-family:inherit; }

.pantalla{ width:100vw; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ---------- Botones ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 28px; border-radius:16px; font-weight:800; font-size:1.05rem; letter-spacing:.3px; transition:transform .08s ease, filter .15s ease; white-space:nowrap; }
.btn:active{ transform:translateY(3px); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-verde{ background:var(--verde); color:#fff; box-shadow:0 4px 0 var(--verde-dark); }
.btn-verde:hover{ filter:brightness(1.05); }
.btn-azul{ background:var(--azul); color:#fff; box-shadow:0 4px 0 var(--azul-dark); }
.btn-amarillo{ background:var(--amarillo); color:#6b4a00; box-shadow:0 4px 0 var(--amarillo-dark); }
.btn-blanco{ background:#fff; color:var(--azul); border:2px solid var(--gris-200); box-shadow:0 4px 0 var(--gris-200); }
.btn-ghost{ background:transparent; color:var(--gris-700); font-weight:700; }
.btn-ancho{ width:100%; }
.btn-lg{ padding:18px 32px; font-size:1.2rem; border-radius:20px; }
.btn-icon{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-thumb{ background:var(--gris-200); border-radius:8px; }
.oculto{ display:none !important; }

/* ---------- Splash / login ---------- */
.splash{ background:linear-gradient(160deg, var(--azul) 0%, #4FC3F7 55%, var(--verde) 100%); align-items:center; justify-content:center; position:relative; }
.splash-blob{ position:absolute; border-radius:50%; opacity:.18; background:#fff; }
.blob1{ width:260px; height:260px; top:-60px; left:-60px; }
.blob2{ width:180px; height:180px; bottom:-40px; right:-40px; }
.blob3{ width:120px; height:120px; bottom:15%; left:8%; }
.splash-panel{ background:#fff; border-radius:28px; width:min(420px, 90vw); max-height:90vh; padding:36px 32px; box-shadow:0 20px 50px rgba(0,0,0,.2); z-index:2; overflow:auto; }
.splash-logo{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; }
.splash-logo .emoji{ font-size:2.6rem; }
.splash-logo h1{ font-size:1.9rem; color:var(--azul-dark); font-weight:800; }
.splash-sub{ text-align:center; color:var(--gris-700); font-weight:600; margin-bottom:26px; font-size:.98rem; }
.splash-opciones{ display:flex; flex-direction:column; gap:14px; }
.campo{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.campo label{ font-weight:800; font-size:.85rem; color:var(--gris-700); }
.campo input, .campo select{ padding:14px 16px; border-radius:14px; border:2px solid var(--gris-200); font-size:1.05rem; font-weight:700; color:var(--texto); outline:none; width:100%; }
.campo input:focus, .campo select:focus{ border-color:var(--azul); }
.avatar-grid{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:6px; }
.avatar-opcion{ font-size:1.8rem; width:56px; height:56px; border-radius:50%; background:var(--gris-100); border:3px solid transparent; display:flex; align-items:center; justify-content:center; }
.avatar-opcion.selec{ border-color:var(--verde); background:#eaffdc; }
.error-msg{ background:#FFEAEA; color:var(--rojo-dark); border-radius:12px; padding:10px 14px; font-weight:700; font-size:.9rem; text-align:center; margin-bottom:10px; }
.link-cambio{ text-align:center; margin-top:18px; font-weight:700; color:var(--gris-700); font-size:.92rem; }
.link-cambio a{ color:var(--azul); text-decoration:none; cursor:pointer; }

/* ---------- Dashboard ---------- */
.topbar{ height:74px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 26px; background:#fff; border-bottom:2px solid var(--gris-200); }
.topbar-brand{ display:flex; align-items:center; gap:10px; font-weight:800; color:var(--azul-dark); font-size:1.2rem; }
.topbar-brand .emoji{ font-size:1.6rem; }
.topbar-user{ display:flex; align-items:center; gap:14px; }
.racha, .puntos{ display:flex; align-items:center; gap:6px; font-weight:800; font-size:1rem; color:var(--gris-700); background:var(--gris-100); padding:8px 14px; border-radius:14px; }
.avatar-chip{ width:40px; height:40px; border-radius:50%; background:var(--gris-100); display:flex; align-items:center; justify-content:center; font-size:1.3rem; border:2px solid var(--gris-200); cursor:pointer; color:var(--azul-dark); }
.avatar-chip svg{ width:20px; height:20px; }
.ruta-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:14px 6vw; overflow:hidden; }
.ruta{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); grid-auto-rows:1fr; gap:18px; width:100%; max-width:1080px; height:100%; max-height:560px; }
.nodo{ position:relative; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:14px 10px; color:#fff; text-align:center; transition:transform .12s ease; }
.nodo:not(.bloqueado):hover{ transform:translateY(-4px); }
.nodo .num{ position:absolute; top:10px; left:12px; font-size:.75rem; font-weight:800; opacity:.85; }
.nodo .icono{ font-size:2.3rem; }
.nodo .nombre{ font-weight:800; font-size:.92rem; line-height:1.15; }
.nodo .estado{ font-size:.72rem; font-weight:700; opacity:.9; }
.nodo.disponible{ background:var(--azul); box-shadow:0 5px 0 var(--azul-dark); cursor:pointer; }
.nodo.completo{ background:var(--verde); box-shadow:0 5px 0 var(--verde-dark); cursor:pointer; }
.nodo.completo{ background:linear-gradient(150deg, var(--verde) 0%, #16A34A 100%); }
.nodo .insignia-completo{ position:absolute; top:8px; right:10px; width:18px; height:18px; }
.nodo.bloqueado{ background:var(--gris-200); color:var(--gris-400); box-shadow:0 5px 0 #d2d2d2; cursor:not-allowed; }
.nodo.bloqueado .icono{ filter:grayscale(1); opacity:.6; }

/* ---------- Lección ---------- */
.leccion-top{ height:64px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 22px; background:#fff; border-bottom:2px solid var(--gris-200); }
.cerrar-btn{ font-size:1.4rem; color:var(--gris-400); background:none; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.cerrar-btn:hover{ background:var(--gris-100); }
.progreso-barra{ flex:1; height:16px; background:var(--gris-200); border-radius:10px; overflow:hidden; }
.progreso-fill{ height:100%; background:var(--verde); border-radius:10px; transition:width .3s ease; }
.tabs{ display:flex; gap:8px; flex-shrink:0; padding:14px 22px 0; }
.tab{ flex:1; padding:10px 8px; text-align:center; border-radius:14px 14px 0 0; font-weight:800; font-size:.9rem; background:var(--gris-200); color:var(--gris-700); }
.tab.activo{ background:#fff; color:var(--azul-dark); }
.tab.hecho::after{ content:" ✓"; color:var(--verde-dark); }
.contenido{ flex:1; background:#fff; overflow:hidden; display:flex; flex-direction:column; padding:26px 6vw; }
.clase-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; overflow:hidden; }
.clase-card{ width:min(680px, 100%); max-height:100%; overflow:auto; background:var(--gris-100); border-radius:24px; padding:34px 38px; text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; }
.clase-card .emoji-grande{ font-size:3rem; }
.clase-card h2{ font-size:1.5rem; color:var(--texto); }
.clase-card p{ font-size:1.08rem; line-height:1.55; color:var(--gris-700); font-weight:600; max-width:56ch; }
.clase-nav{ display:flex; align-items:center; gap:18px; }
.puntitos{ display:flex; gap:7px; }
.punto{ width:9px; height:9px; border-radius:50%; background:var(--gris-200); }
.punto.activo{ background:var(--azul); width:22px; border-radius:6px; }
.lab-wrap{ flex:1; display:flex; flex-direction:column; gap:16px; overflow:hidden; }
.lab-instrucciones{ text-align:center; font-weight:700; color:var(--gris-700); flex-shrink:0; }
.lab-instrucciones h2{ color:var(--texto); margin-bottom:4px; }
.lab-area{ flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; }
.orden-lista{ display:flex; flex-direction:column; gap:10px; width:min(560px,100%); }
.orden-item{ background:var(--gris-100); border:2px solid var(--gris-200); border-radius:14px; padding:14px 16px; font-weight:700; display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none; }
.orden-item .badge{ width:28px; height:28px; border-radius:50%; background:#fff; border:2px solid var(--gris-200); display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:800; flex-shrink:0; }
.orden-item.marcado{ border-color:var(--azul); background:#EAF7FF; }
.orden-item.marcado .badge{ background:var(--azul); color:#fff; border-color:var(--azul); }
.match-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; width:min(680px,100%); }
.match-col{ display:flex; flex-direction:column; gap:10px; }
.match-item{ background:var(--gris-100); border:2px solid var(--gris-200); border-radius:14px; padding:14px; font-weight:700; text-align:center; font-size:.95rem; }
.match-item.sel{ border-color:var(--azul); background:#EAF7FF; }
.match-item.ok{ border-color:var(--verde); background:#EAFFDC; color:var(--verde-dark); }
.match-item.mal{ border-color:var(--rojo); background:#FFEAEA; color:var(--rojo-dark); }
.quiz-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; overflow:hidden; }
.quiz-pregunta{ font-size:1.3rem; font-weight:800; text-align:center; max-width:60ch; }
.quiz-opciones{ display:flex; flex-direction:column; gap:12px; width:min(560px,100%); }
.quiz-opcion{ background:var(--gris-100); border:2px solid var(--gris-200); border-radius:14px; padding:15px 18px; font-weight:700; text-align:left; font-size:1.02rem; }
.quiz-opcion:hover{ border-color:var(--azul); }
.quiz-opcion.correcta{ border-color:var(--verde); background:#EAFFDC; color:var(--verde-dark); }
.quiz-opcion.incorrecta{ border-color:var(--rojo); background:#FFEAEA; color:var(--rojo-dark); }
.quiz-opcion:disabled{ cursor:default; }
.quiz-resultado{ display:flex; flex-direction:column; align-items:center; gap:14px; }
.quiz-resultado .emoji-grande{ font-size:3.4rem; }
.quiz-resultado h2{ font-size:1.6rem; }
.pie-accion{ flex-shrink:0; padding:16px 6vw 22px; display:flex; justify-content:center; background:#fff; border-top:2px solid var(--gris-100); }

/* ---------- Zona de profesor (tema oscuro, distinto a la de los niños) ---------- */
.profesor-fondo{ background:linear-gradient(160deg,#0F172A 0%,#111827 60%,#1E293B 100%); align-items:center; justify-content:center; }
.profesor-login-panel{ background:#111827; border-radius:24px; width:min(400px,90vw); padding:34px 32px; box-shadow:0 20px 50px rgba(0,0,0,.45); }
.profesor-login-panel .campo label{ color:#94A3B8; }
.profesor-login-panel .campo input{ background:#1E293B; border-color:#334155; color:#E2E8F0; }
.profesor-tema{ background:#0F172A; color:#E2E8F0; }
.profesor-top{ height:74px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 26px; background:#111827; border-bottom:2px solid #1E293B; }
.profesor-brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.2rem; color:#38BDF8; }
.profesor-resumen{ display:flex; gap:14px; padding:16px 26px 0; flex-wrap:wrap; flex-shrink:0; }
.resumen-chip{ background:#111827; border:1px solid #1E293B; border-radius:14px; padding:10px 18px; font-weight:800; color:#38BDF8; font-size:.9rem; display:flex; align-items:center; gap:8px; }
.profesor-tabla-wrap{ flex:1; overflow:auto; padding:18px 26px 26px; }
table.tabla-estudiantes{ width:100%; border-collapse:collapse; background:#111827; border-radius:16px; overflow:hidden; }
.tabla-estudiantes th, .tabla-estudiantes td{ padding:12px 14px; text-align:left; font-size:.87rem; white-space:nowrap; }
.tabla-estudiantes thead th{ background:#1E293B; color:#94A3B8; font-weight:800; text-transform:uppercase; font-size:.68rem; letter-spacing:.5px; position:sticky; top:0; }
.tabla-estudiantes tbody tr{ border-bottom:1px solid #1E293B; }
.tabla-estudiantes tbody tr:hover{ background:#1E293B; }
.badge-mod{ display:inline-flex; width:26px; height:26px; border-radius:50%; align-items:center; justify-content:center; font-size:.72rem; font-weight:800; margin-right:3px; color:#fff; }
.badge-mod.completo{ background:#16A34A; }
.badge-mod.progreso{ background:#CA8A04; }
.badge-mod.vacio{ background:#1E293B; color:#475569; }
.profesor-empty{ text-align:center; color:#64748B; padding:60px 20px; font-weight:700; }
.estudiante-nombre{ display:flex; align-items:center; gap:8px; font-weight:800; }

@media (max-width:760px){
  .ruta{ grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:repeat(4,1fr); }
  .match-grid{ grid-template-columns:1fr 1fr; gap:12px; }
  .contenido{ padding:18px 4vw; }
  .clase-card{ padding:22px 20px; }
  .splash-panel{ padding:26px 20px; }
}

/* ---------- Lección enriquecida: eyebrow, coach, clave, tarjetas/flujo ---------- */
.eyebrow-pill{ display:inline-block; background:var(--gris-100); color:var(--azul-dark); padding:4px 14px; border-radius:20px; font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.6px; }
.coach-bubble{ background:#FFF7E5; border:2px dashed var(--amarillo-dark); border-radius:14px; padding:10px 16px; font-size:.85rem; font-weight:700; color:#6b4a00; font-style:italic; max-width:58ch; }
.key-box{ background:#EAFFDC; border-radius:14px; padding:10px 16px; font-size:.85rem; font-weight:800; color:var(--verde-dark); max-width:58ch; }

.mini-cards-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.mini-card{ background:#fff; border:2px solid var(--gris-200); border-radius:14px; padding:12px 14px; width:160px; text-align:center; }
.mini-card .mc-titulo{ font-weight:800; font-size:.85rem; margin-bottom:4px; }
.mini-card .mc-texto{ font-size:.74rem; color:var(--gris-700); font-weight:600; line-height:1.32; }

.flow-row{ display:flex; align-items:stretch; gap:6px; justify-content:center; flex-wrap:wrap; }
.flow-step{ background:#fff; border:2px solid var(--azul); border-radius:14px; padding:10px 14px; width:160px; text-align:center; }
.flow-step .fs-label{ font-weight:800; font-size:.78rem; color:var(--azul-dark); margin-bottom:4px; }
.flow-step .fs-texto{ font-size:.74rem; color:var(--gris-700); font-weight:600; line-height:1.32; }
.flow-arrow{ display:flex; align-items:center; font-size:1.3rem; color:var(--gris-400); }

.portada-card .emoji-grande{ font-size:2.6rem; }
.portada-objetivos{ text-align:left; display:flex; flex-direction:column; gap:8px; max-width:52ch; margin-top:4px; }
.portada-objetivos div{ font-size:.88rem; font-weight:700; color:var(--gris-700); }

.eyebrow-pill{ display:inline-flex; align-items:center; gap:6px; }
.coach-bubble{ display:flex; align-items:flex-start; gap:8px; text-align:left; }

.eo-icono{ flex-shrink:0; }
.icon-badge svg{ width:18px; height:18px; }

/* ---------- Laboratorio: secuencia con mensaje en vivo ---------- */
.lab-mensaje{ text-align:center; font-weight:800; font-size:.9rem; border-radius:14px; padding:10px 16px; background:var(--gris-100); color:var(--gris-700); flex-shrink:0; }
.lab-mensaje.ok{ background:#EAFFDC; color:var(--verde-dark); }
.lab-mensaje.mal{ background:#FFEAEA; color:var(--rojo-dark); }

/* ---------- Laboratorio: escenario (elegir la mejor opción) ---------- */
.escenario-lista{ display:flex; flex-direction:column; gap:12px; width:min(600px,100%); }
.escenario-opcion{ display:flex; gap:14px; align-items:flex-start; background:var(--gris-100); border:2px solid var(--gris-200); border-radius:16px; padding:14px 16px; text-align:left; }
.escenario-opcion .eo-icono{ font-size:1.6rem; flex-shrink:0; }
.escenario-opcion .eo-titulo{ font-weight:800; font-size:.95rem; margin-bottom:2px; }
.escenario-opcion .eo-texto{ font-size:.8rem; color:var(--gris-700); font-weight:600; line-height:1.35; }
.escenario-opcion:hover{ border-color:var(--azul); }
.escenario-opcion.correcta{ border-color:var(--verde); background:#EAFFDC; }
.escenario-opcion.incorrecta{ border-color:var(--rojo); background:#FFEAEA; }
.escenario-opcion:disabled{ cursor:default; }

/* ---------- Quiz: pista y explicación ---------- */
.btn-pista{ background:none; border:2px dashed var(--gris-400); border-radius:12px; padding:6px 14px; font-weight:800; font-size:.78rem; color:var(--gris-700); display:inline-flex; align-items:center; gap:6px; }
.btn-pista:hover{ border-color:var(--azul); color:var(--azul-dark); }
.pista-texto{ font-size:.8rem; font-weight:700; color:var(--gris-700); background:var(--gris-100); border-radius:12px; padding:8px 14px; max-width:56ch; text-align:center; }
.explicacion-caja{ font-size:.82rem; font-weight:700; color:var(--gris-700); background:var(--gris-100); border-radius:14px; padding:10px 16px; max-width:56ch; text-align:center; }
.explicacion-caja.ok{ background:#EAFFDC; color:var(--verde-dark); }


/* ===========================================================
   ÍCONOS (Lucide) — reemplazan los emojis en toda la app
   =========================================================== */
svg{ display:block; width:1.15em; height:1.15em; flex-shrink:0; }
.icon-inline{ width:1.15em; height:1.15em; flex-shrink:0; vertical-align:-0.2em; }
.btn .icon-inline{ width:20px; height:20px; }
.btn{ gap:10px; }

.logo-badge{
  width:56px; height:56px; border-radius:20px;
  background:linear-gradient(145deg, var(--azul) 0%, var(--verde) 100%);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 14px rgba(28,176,246,.35);
}
.logo-badge svg{ width:30px; height:30px; color:#fff; }
.logo-badge-profesor{ background:linear-gradient(145deg, #38BDF8 0%, #6366F1 100%); box-shadow:0 6px 14px rgba(56,189,248,.35); }

.link-cambio a{ display:inline-flex; align-items:center; gap:6px; }
.link-cambio a .icon-inline{ width:16px; height:16px; }

/* Selector de avatar: iconos robóticos en circulos de color */
.avatar-opcion{ color:var(--azul-dark); }
.avatar-opcion svg{ width:26px; height:26px; }
.avatar-opcion.selec{ color:var(--verde-dark); }

/* Icono-insignia: circulo de color detras de un icono (tarjetas, flujo, objetivos) */
.icon-badge{
  width:34px; height:34px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg, var(--azul) 0%, var(--morado) 100%);
  color:#fff; margin:0 auto 6px;
}
.icon-badge svg{ width:18px; height:18px; }
.icon-badge.verde{ background:linear-gradient(145deg, var(--verde) 0%, #22C55E 100%); }
.icon-badge.amarillo{ background:linear-gradient(145deg, var(--amarillo) 0%, var(--naranja) 100%); }
.icon-badge.rojo{ background:linear-gradient(145deg, var(--rojo) 0%, #EC4899 100%); }
.icon-badge.chico{ width:26px; height:26px; border-radius:9px; margin:0 auto 6px; }
.icon-badge.chico svg{ width:14px; height:14px; }

.coach-bubble, .key-box{ display:flex; align-items:flex-start; gap:8px; text-align:left; }
.coach-bubble .icon-inline, .key-box .icon-inline{ width:18px; height:18px; margin-top:1px; flex-shrink:0; }

.portada-objetivos div{ display:flex; align-items:flex-start; gap:8px; }
.portada-objetivos .icon-inline{ width:16px; height:16px; margin-top:2px; color:var(--verde-dark); flex-shrink:0; }

/* ===========================================================
   SALUDO PERSONALIZADO EN EL DASHBOARD
   =========================================================== */
.topbar-saludo{ display:flex; flex-direction:column; line-height:1.15; }
.topbar-saludo .saludo-linea1{ font-weight:800; color:var(--azul-dark); font-size:1.05rem; }
.topbar-saludo .saludo-linea2{ font-weight:700; color:var(--gris-400); font-size:.72rem; }

/* ===========================================================
   PESTAÑAS BLOQUEADAS (no se puede pasar de paso sin terminar el anterior)
   =========================================================== */
.tab.bloqueado{ opacity:.45; cursor:not-allowed; }
.tab .icon-inline{ width:16px; height:16px; margin-right:4px; vertical-align:-0.15em; }
.tab-candado{ width:13px; height:13px; margin-left:4px; vertical-align:-0.1em; }

/* ===========================================================
   MEJORAS VISUALES GENERALES
   =========================================================== */
body{ background:var(--gris-100); }

.nodo{ position:relative; overflow:hidden; }
.nodo::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(160deg, rgba(255,255,255,.28), transparent 55%);
  pointer-events:none;
}
.nodo .icono-nodo{ width:34px; height:34px; }
.nodo .icono-nodo svg{ width:100%; height:100%; }
.nodo.disponible{ background:linear-gradient(150deg, var(--azul) 0%, #0EA5E9 100%); }
.nodo.completo{ background:linear-gradient(150deg, var(--verde) 0%, #16A34A 100%); }
.nodo.bloqueado{ background:var(--gris-200); }
.nodo.disponible, .nodo.completo{ animation: aparecerNodo .5s ease backwards; }
.ruta .nodo:nth-child(1){ animation-delay:.02s; }
.ruta .nodo:nth-child(2){ animation-delay:.08s; }
.ruta .nodo:nth-child(3){ animation-delay:.14s; }
.ruta .nodo:nth-child(4){ animation-delay:.20s; }
.ruta .nodo:nth-child(5){ animation-delay:.26s; }
.ruta .nodo:nth-child(6){ animation-delay:.32s; }
.ruta .nodo:nth-child(7){ animation-delay:.38s; }

.splash-panel{ animation: aparecerPanel .45s cubic-bezier(.2,.9,.3,1.2) both; }
.clase-card, .escenario-lista, .quiz-wrap > *{ animation: aparecerSuave .35s ease both; }

.mini-card, .flow-step{ transition: transform .15s ease, box-shadow .15s ease; }
.mini-card:hover, .flow-step:hover{ transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,0,0,.08); }

.escenario-opcion{ transition: transform .12s ease, box-shadow .12s ease; }
.escenario-opcion:not(:disabled):hover{ transform:translateY(-2px); box-shadow:0 8px 16px rgba(0,0,0,.06); }

.quiz-opcion{ transition: transform .1s ease; }
.quiz-opcion:not(:disabled):hover{ transform:translateX(3px); }

.punto{ transition: width .2s ease, background .2s ease; }
.progreso-fill{ background:linear-gradient(90deg, var(--verde) 0%, #22C55E 100%); }

@keyframes aparecerNodo{ from{ opacity:0; transform:translateY(10px) scale(.94); } to{ opacity:1; transform:none; } }
@keyframes aparecerPanel{ from{ opacity:0; transform:translateY(14px) scale(.97); } to{ opacity:1; transform:none; } }
@keyframes aparecerSuave{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

/* Confeti simple al aprobar el quiz */
.confeti-wrap{ position:relative; }
.confeti{ position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; opacity:0; animation: caerConfeti 1.1s ease-out forwards; }
@keyframes caerConfeti{
  0%{ opacity:1; transform:translateY(0) rotate(0deg); }
  100%{ opacity:0; transform:translateY(120px) rotate(280deg); }
}

/* ===========================================================
   AJUSTES DE ESPACIO PARA QUE LA CLASE NUNCA NECESITE SCROLL
   =========================================================== */
.clase-card{ padding:22px 30px; gap:10px; }
.clase-card h2{ font-size:1.28rem; }
.clase-card p{ font-size:.94rem; }
.coach-bubble, .key-box{ font-size:.78rem; padding:8px 12px; }
.mini-cards-row, .flow-row{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; width:100%; max-width:600px; }
.mini-card, .flow-step{ width:auto; padding:10px 8px; }
.mini-card .mc-titulo, .flow-step .fs-label{ font-size:.78rem; }
.mini-card .mc-texto, .flow-step .fs-texto{ font-size:.68rem; }
.flow-arrow{ display:none; }
.eyebrow-pill{ font-size:.65rem; padding:3px 11px; }

@media (max-width:760px){
  .mini-cards-row, .flow-row{ grid-template-columns:1fr; max-width:340px; }
  .topbar-saludo .saludo-linea1{ font-size:.92rem; }
  .topbar-saludo .saludo-linea2{ display:none; }
  .clase-card{ padding:18px 18px; }
}
@media (max-height:680px){

  .clase-card h2{ font-size:1.1rem; }
  .clase-card p{ font-size:.85rem; }
}

// Devuelve el marcado SVG de un icono. Si la clave no existe (p.ej. avatares
// antiguos guardados como emoji antes de esta actualización), cae de vuelta
// a mostrar el texto tal cual para no romper cuentas ya creadas.
function icono(clave, atributos){
  atributos = atributos || '';
  if(ICONOS[clave]){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' + atributos + '>' + ICONOS[clave] + '</svg>';
  }
  return '<span class="icono-fallback">' + clave + '</span>';
}
</script>

<script>
/* ===========================================================
   NUCLEO DE LA APP: usuarios y progreso, guardados en Firestore
   =========================================================== */
const RK_SESSION_KEY = "robokids_sesion";
const RK_PROFESOR_KEY = "robokids_sesion_profesor";
const COL_USUARIOS = "usuarios";

function idDeUsuario(nombre){
  return (nombre || "").trim().toLowerCase().replace(/\s+/g, "_");
}
function progresoVacio(){
  return { claseVista:false, labHecho:false, quizMejorPuntaje:0, completado:false };
}

const RoboKids = {
  _usuario: null,

  async init(){
    const id = localStorage.getItem(RK_SESSION_KEY);
    if(!id){ this._usuario = null; return null; }
    try{
      const doc = await db.collection(COL_USUARIOS).doc(id).get();
      if(!doc.exists){ this._usuario = null; return null; }
      this._usuario = Object.assign({ id: doc.id }, doc.data());
      return this._usuario;
    }catch(e){
      console.error("Error cargando usuario:", e);
      this._usuario = null;
      return null;
    }
  },

  usuarioActual(){ return this._usuario; },
  iniciarSesion(id){ localStorage.setItem(RK_SESSION_KEY, id); },
  cerrarSesion(){ localStorage.removeItem(RK_SESSION_KEY); this._usuario = null; },

  async crearUsuario(nombre, pin, avatar){
    nombre = (nombre || "").trim();
    if(nombre.length < 2) return { ok:false, error:"Tu nombre debe tener al menos 2 letras." };
    if(!/^\d{4}$/.test(pin)) return { ok:false, error:"El código secreto debe tener 4 números." };

    const id = idDeUsuario(nombre);
    try{
      const ref = db.collection(COL_USUARIOS).doc(id);
      const existente = await ref.get();
      if(existente.exists) return { ok:false, error:"Ese nombre ya existe. ¡Elige otro o inicia sesión!" };
      const nuevo = { nombre, pin, avatar: avatar || "robot", creado: new Date().toISOString(), puntos:0, racha:0, progreso:{} };
      await ref.set(nuevo);
      this._usuario = Object.assign({ id }, nuevo);
      this.iniciarSesion(id);
      return { ok:true };
    }catch(e){
      console.error(e);
      return { ok:false, error:"No pudimos conectar con el servidor. Revisa tu internet e inténtalo de nuevo." };
    }
  },

  async ingresar(nombre, pin){
    const id = idDeUsuario(nombre);
    try{
      const doc = await db.collection(COL_USUARIOS).doc(id).get();
      if(!doc.exists) return { ok:false, error:"No encontramos ese usuario. ¿Ya lo creaste?" };
      const datos = doc.data();
      if(datos.pin !== pin) return { ok:false, error:"Código secreto incorrecto. ¡Intenta de nuevo!" };
      this._usuario = Object.assign({ id }, datos);
      this.iniciarSesion(id);
      return { ok:true };
    }catch(e){
      console.error(e);
      return { ok:false, error:"No pudimos conectar con el servidor. Revisa tu internet e inténtalo de nuevo." };
    }
  },

  progresoModulo(moduloId){
    if(!this._usuario || !this._usuario.progreso) return progresoVacio();
    return this._usuario.progreso[moduloId] || progresoVacio();
  },

  async marcarClaseVista(moduloId){
    const u = this._usuario;
    if(!u) return;
    if(!u.progreso) u.progreso = {};
    if(!u.progreso[moduloId]) u.progreso[moduloId] = progresoVacio();
    u.progreso[moduloId].claseVista = true;
    await db.collection(COL_USUARIOS).doc(u.id).set({ progreso: { [moduloId]: { claseVista:true } } }, { merge:true });
  },

  async marcarLabHecho(moduloId){
    const u = this._usuario;
    if(!u) return;
    if(!u.progreso) u.progreso = {};
    if(!u.progreso[moduloId]) u.progreso[moduloId] = progresoVacio();
    const cambios = { progreso: { [moduloId]: { labHecho:true } } };
    if(!u.progreso[moduloId].labHecho){
      u.puntos = (u.puntos || 0) + 10;
      cambios.puntos = firebase.firestore.FieldValue.increment(10);
    }
    u.progreso[moduloId].labHecho = true;
    await db.collection(COL_USUARIOS).doc(u.id).set(cambios, { merge:true });
  },

  async registrarQuiz(moduloId, aciertos, total){
    const u = this._usuario;
    if(!u) return;
    if(!u.progreso) u.progreso = {};
    if(!u.progreso[moduloId]) u.progreso[moduloId] = progresoVacio();
    const p = u.progreso[moduloId];
    const puntaje = Math.round((aciertos/total) * 100);
    if(puntaje > p.quizMejorPuntaje) p.quizMejorPuntaje = puntaje;
    const cambios = { progreso: { [moduloId]: { quizMejorPuntaje: p.quizMejorPuntaje } } };
    let aprobadoAhora = false;
    if(puntaje >= 60 && !p.completado){
      p.completado = true;
      u.puntos = (u.puntos || 0) + 20;
      u.racha = (u.racha || 0) + 1;
      cambios.progreso[moduloId].completado = true;
      cambios.puntos = firebase.firestore.FieldValue.increment(20);
      cambios.racha = firebase.firestore.FieldValue.increment(1);
      aprobadoAhora = true;
    }
    await db.collection(COL_USUARIOS).doc(u.id).set(cambios, { merge:true });
    return { aprobado: puntaje >= 60, puntaje, aprobadoAhora };
  },

  moduloDesbloqueado(index){
    if(index === 0) return true;
    if(!this._usuario) return false;
    const anterior = MODULOS[index-1];
    const p = this._usuario.progreso && this._usuario.progreso[anterior.id];
    return !!(p && p.completado);
  },

  sesionProfesorActiva(){ return sessionStorage.getItem(RK_PROFESOR_KEY) === "1"; },
  ingresarProfesor(clave){
    if(clave === CLAVE_PROFESOR){ sessionStorage.setItem(RK_PROFESOR_KEY, "1"); return true; }
    return false;
  },
  salirProfesor(){ sessionStorage.removeItem(RK_PROFESOR_KEY); },

  async listarEstudiantes(){
    const snap = await db.collection(COL_USUARIOS).get();
    const lista = [];
    snap.forEach(doc => lista.push(Object.assign({ id: doc.id }, doc.data())));
    lista.sort((a,b) => (b.puntos||0) - (a.puntos||0));
    return lista;
  }
};
</script>
<script>
/* ===========================================================
   ENRUTADOR — cambia de "pantalla" sin recargar la página
   =========================================================== */
const PANTALLAS = ["splash","dashboard","leccion","profesor-login","profesor-panel"];
function mostrarPantalla(id){
  PANTALLAS.forEach(p => document.getElementById("pantalla-"+p).classList.toggle("oculto", p !== id));
}

/* ===========================================================
   PANTALLA: SPLASH
   =========================================================== */
const pasoInicio = document.getElementById("paso-inicio");
const pasoCrear = document.getElementById("paso-crear");
const pasoIngresar = document.getElementById("paso-ingresar");

function mostrarPasoSplash(paso){
  [pasoInicio, pasoCrear, pasoIngresar].forEach(p => p.classList.add("oculto"));
  paso.classList.remove("oculto");
}

document.getElementById("btn-soy-nuevo").onclick = () => mostrarPasoSplash(pasoCrear);
document.getElementById("btn-ya-tengo").onclick = () => mostrarPasoSplash(pasoIngresar);
document.getElementById("crear-volver").onclick = () => mostrarPasoSplash(pasoInicio);
document.getElementById("ingresar-volver").onclick = () => mostrarPasoSplash(pasoInicio);
document.getElementById("link-profesor").onclick = () => mostrarPantalla("profesor-login");

let avatarElegido = "robot";
document.querySelectorAll(".avatar-opcion").forEach(el => {
  el.onclick = () => {
    document.querySelectorAll(".avatar-opcion").forEach(o => o.classList.remove("selec"));
    el.classList.add("selec");
    avatarElegido = el.dataset.avatar;
  };
});

document.getElementById("paso-crear").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nombre = document.getElementById("crear-nombre").value;
  const pin = document.getElementById("crear-pin").value;
  const errorBox = document.getElementById("crear-error");
  const boton = document.getElementById("crear-submit");
  boton.disabled = true; boton.textContent = "Creando...";
  try{
    const res = await RoboKids.crearUsuario(nombre, pin, avatarElegido);
    if(!res.ok){ errorBox.textContent = res.error; errorBox.classList.remove("oculto"); return; }
    errorBox.classList.add("oculto");
    mostrarPantalla("dashboard");
    initDashboard();
  }catch(err){
    console.error(err);
    errorBox.textContent = "Algo salió mal conectando con el servidor. Revisa la consola (F12) y tu configuración de Firebase.";
    errorBox.classList.remove("oculto");
  }finally{
    boton.disabled = false; boton.innerHTML = `Crear mi usuario${icono('rocket')}`;
  }
});

document.getElementById("paso-ingresar").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nombre = document.getElementById("ingresar-nombre").value;
  const pin = document.getElementById("ingresar-pin").value;
  const errorBox = document.getElementById("ingresar-error");
  const boton = document.getElementById("ingresar-submit");
  boton.disabled = true; boton.textContent = "Entrando...";
  try{
    const res = await RoboKids.ingresar(nombre, pin);
    if(!res.ok){ errorBox.textContent = res.error; errorBox.classList.remove("oculto"); return; }
    errorBox.classList.add("oculto");
    mostrarPantalla("dashboard");
    initDashboard();
  }catch(err){
    console.error(err);
    errorBox.textContent = "Algo salió mal conectando con el servidor. Revisa la consola (F12) y tu configuración de Firebase.";
    errorBox.classList.remove("oculto");
  }finally{
    boton.disabled = false; boton.innerHTML = `Entrar${icono('unlock')}`;
  }
});

/* ===========================================================
   PANTALLA: DASHBOARD
   =========================================================== */
function saludoSegunHora(){
  const h = new Date().getHours();
  if(h >= 5 && h < 12) return "Buenos días";
  if(h >= 12 && h < 19) return "Buenas tardes";
  return "Buenas noches";
}

function initDashboard(){
  const usuario = RoboKids.usuarioActual();
  if(!usuario){ mostrarPantalla("splash"); return; }

  document.getElementById("topbar-brand").innerHTML = `
    <span class="logo-badge" style="width:38px;height:38px;border-radius:12px;">${icono('robot','')}</span>
    <div class="topbar-saludo">
      <span class="saludo-linea1">${saludoSegunHora()}, ${usuario.nombre} 👋</span>
      <span class="saludo-linea2">Bienvenido de nuevo a RoboKids</span>
    </div>
  `;
  document.getElementById("racha-chip").innerHTML = `${icono('flame')}<span id="racha-num">${usuario.racha || 0}</span>`;
  document.getElementById("puntos-chip").innerHTML = `${icono('star')}<span id="puntos-num">${usuario.puntos || 0}</span>`;
  document.getElementById("avatar-chip").innerHTML = icono(usuario.avatar || 'robot', '');

  document.getElementById("avatar-chip").onclick = () => {
    if(confirm("¿Quieres cerrar sesión, " + usuario.nombre + "?")){
      RoboKids.cerrarSesion();
      mostrarPantalla("splash");
      mostrarPasoSplash(pasoInicio);
    }
  };

  const rutaEl = document.getElementById("ruta");
  rutaEl.innerHTML = "";

  MODULOS.forEach((m, i) => {
    const desbloqueado = RoboKids.moduloDesbloqueado(i);
    const prog = RoboKids.progresoModulo(m.id);
    const completado = prog.completado;

    const nodo = document.createElement(desbloqueado ? "button" : "div");
    nodo.className = "nodo " + (completado ? "completo" : (desbloqueado ? "disponible" : "bloqueado"));

    let estadoTexto = "Bloqueado";
    let estadoIcono = "lock";
    if(completado){ estadoTexto = "¡Completado!"; estadoIcono = "checkcircle"; }
    else if(desbloqueado){ estadoTexto = prog.claseVista ? "Continuar" : "Empezar"; estadoIcono = "play"; }

    nodo.innerHTML = `
      <span class="num">${m.orden}</span>
      ${completado ? `<span class="insignia-completo">${icono('star','style="width:100%;height:100%;color:#fff;"')}</span>` : ''}
      <span class="icono icono-nodo">${icono(m.icono, '')}</span>
      <span class="nombre">${m.nombre}</span>
      <span class="estado">${!desbloqueado ? icono('lock','style="width:11px;height:11px;vertical-align:-1px;margin-right:3px;"') : ''}${estadoTexto}</span>
    `;

    if(desbloqueado){
      nodo.onclick = () => { mostrarPantalla("leccion"); initLeccion(m.id); };
    }
    rutaEl.appendChild(nodo);
  });
}

/* ===========================================================
   PANTALLA: LECCIÓN
   =========================================================== */
const contenidoEl = document.getElementById("contenido");
const pieEl = document.getElementById("pie-accion");
const tabsEls = document.querySelectorAll(".tab");

let modulo = null;
let vista = "clase";
let claseIndex = 0;
let quizIndex = 0;
let quizAciertos = 0;
let quizRespondida = false;

document.getElementById("btn-cerrar").onclick = () => { mostrarPantalla("dashboard"); initDashboard(); };
tabsEls.forEach(t => { t.onclick = () => cambiarVista(t.dataset.tab); });

function initLeccion(moduloId){
  modulo = obtenerModulo(moduloId);
  if(!modulo){ mostrarPantalla("dashboard"); return; }
  claseIndex = 0;
  actualizarProgresoBarra();
  cambiarVista("clase");
}

function actualizarProgresoBarra(){
  const prog = RoboKids.progresoModulo(modulo.id);
  let pasos = 0;
  if(prog.claseVista) pasos++;
  if(prog.labHecho) pasos++;
  if(prog.completado) pasos++;
  document.getElementById("progreso-fill").style.width = (pasos/3*100) + "%";
  tabsEls.forEach(t => {
    const tipo = t.dataset.tab;
    t.classList.toggle("hecho",
      (tipo==="clase" && prog.claseVista) || (tipo==="lab" && prog.labHecho) || (tipo==="quiz" && prog.completado));
    const bloqueada = (tipo === "lab" && !prog.claseVista) || (tipo === "quiz" && !prog.labHecho);
    t.classList.toggle("bloqueado", bloqueada);
    t.title = bloqueada ? "Termina el paso anterior primero" : "";
  });
}

function pasoDisponible(tipo){
  const prog = RoboKids.progresoModulo(modulo.id);
  if(tipo === "lab") return prog.claseVista;
  if(tipo === "quiz") return prog.labHecho;
  return true;
}

function cambiarVista(nueva){
  if(!pasoDisponible(nueva)) return;
  vista = nueva;
  tabsEls.forEach(t => t.classList.toggle("activo", t.dataset.tab === vista));
  if(vista === "clase") renderClase();
  if(vista === "lab") renderLab();
  if(vista === "quiz") renderQuiz();
}

/* ===========================================================
   CLASE — portada (tagline + objetivos) + lecciones (tarjetas/flujo)
   =========================================================== */
function itemsDeClase(){
  const portada = {
    portada: true,
    titulo: modulo.nombre,
    subtitulo: modulo.tagline,
    objetivos: modulo.objetivos
  };
  return [portada, ...modulo.lecciones];
}

function renderClase(){
  const items = itemsDeClase();
  const total = items.length;
  const item = items[claseIndex];
  const esUltima = claseIndex === total - 1;

  let cuerpoHtml;
  if(item.portada){
    cuerpoHtml = `
      <div class="icon-badge" style="width:52px;height:52px;border-radius:18px;">${icono('sparkle','style="width:26px;height:26px;"')}</div>
      <h2>${item.titulo}</h2>
      <p>${item.subtitulo}</p>
      <div class="portada-objetivos">
        ${item.objetivos.map(o => `<div>${icono('target')}<span>${o}</span></div>`).join("")}
      </div>
    `;
  }else{
    let contenidoTipo = "";
    if(item.tipo === "tarjetas"){
      contenidoTipo = `<div class="mini-cards-row">${item.tarjetas.map(t => `
        <div class="mini-card"><div class="icon-badge chico">${icono(t.icono)}</div><div class="mc-titulo">${t.titulo}</div><div class="mc-texto">${t.texto}</div></div>
      `).join("")}</div>`;
    }else if(item.tipo === "flujo"){
      contenidoTipo = `<div class="flow-row">${item.flujo.map((f,i) => `
        ${i>0 ? `<div class="flow-arrow">${icono('chevronright')}</div>` : ''}
        <div class="flow-step"><div class="icon-badge chico verde">${icono(f.icono)}</div><div class="fs-label">${f.etiqueta}</div><div class="fs-texto">${f.texto}</div></div>
      `).join("")}</div>`;
    }

    cuerpoHtml = `
      <span class="eyebrow-pill">${item.eyebrow}</span>
      <h2>${item.titulo}</h2>
      <p>${item.subtitulo}</p>
      <div class="coach-bubble">${icono('chat')}<span>${item.coach}</span></div>
      ${contenidoTipo}
      <div class="key-box">${icono('bulb')}<span>${item.clave}</span></div>
    `;
  }

  contenidoEl.innerHTML = `
    <div class="clase-wrap">
      <div class="clase-card ${item.portada ? 'portada-card' : ''}">${cuerpoHtml}</div>
      <div class="clase-nav">
        <button class="btn btn-icon btn-blanco" id="clase-prev" ${claseIndex===0 ? "disabled":""}>${icono('chevronleft')}</button>
        <div class="puntitos">${items.map((_,i)=>`<div class="punto ${i===claseIndex?'activo':''}"></div>`).join("")}</div>
        <button class="btn btn-icon btn-blanco" id="clase-next" ${esUltima ? "disabled":""}>${icono('chevronright')}</button>
      </div>
    </div>
  `;

  document.getElementById("clase-prev").onclick = () => { claseIndex--; renderClase(); };
  document.getElementById("clase-next").onclick = () => { claseIndex++; renderClase(); };

  pieEl.innerHTML = esUltima
    ? `<button class="btn btn-verde btn-lg" id="btn-ir-lab">Ir al Laboratorio${icono('flask')}</button>`
    : `<button class="btn btn-azul btn-lg" id="btn-clase-siguiente">Siguiente${icono('chevronright')}</button>`;

  if(esUltima){
    RoboKids.marcarClaseVista(modulo.id).catch(console.error);
    actualizarProgresoBarra();
    document.getElementById("btn-ir-lab").onclick = () => cambiarVista("lab");
  }else{
    document.getElementById("btn-clase-siguiente").onclick = () => { claseIndex++; renderClase(); };
  }
}

/* ===========================================================
   LABORATORIO — secuencia (ordenar con feedback en vivo) o escenario (elegir la mejor opción)
   =========================================================== */
function renderLab(){
  if(modulo.lab.tipo === "secuencia") renderLabSecuencia();
  if(modulo.lab.tipo === "escenario") renderLabEscenario();
}

function renderLabSecuencia(){
  const pasos = modulo.lab.pasos;
  const mensajes = modulo.lab.mensajes;
  const mezclado = pasos.map((texto, i) => ({ texto, correcto:i })).sort((a,b)=> (a.texto.length%3) - (b.texto.length%3));
  let seleccion = [];

  function estado(){
    if(seleccion.length === 0) return { texto: mensajes.vacio, clase: "" };
    const prefijoCorrecto = seleccion.every((idx, pos) => mezclado[idx].correcto === pos);
    if(!prefijoCorrecto) return { texto: mensajes.incorrecto, clase: "mal" };
    if(seleccion.length === mezclado.length) return { texto: mensajes.correcto, clase: "ok" };
    return { texto: mensajes.parcial, clase: "" };
  }

  function pintar(){
    const est = estado();
    contenidoEl.innerHTML = `
      <div class="lab-wrap">
        <div class="lab-instrucciones"><h2>${icono('flask')}${modulo.lab.titulo}</h2><p>${modulo.lab.subtitulo}</p></div>
        <div class="lab-mensaje ${est.clase}">${est.texto}</div>
        <div class="lab-area"><div class="orden-lista" id="orden-lista">
          ${mezclado.map((it, idx) => {
            const pos = seleccion.indexOf(idx);
            return `<div class="orden-item ${pos>-1?'marcado':''}" data-idx="${idx}">
                      <span class="badge">${pos>-1 ? (pos+1) : ""}</span><span>${it.texto}</span></div>`;
          }).join("")}
        </div></div>
      </div>
    `;
    document.querySelectorAll(".orden-item").forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.dataset.idx);
        const pos = seleccion.indexOf(idx);
        if(pos>-1){ seleccion.splice(pos,1); } else { seleccion.push(idx); }

        if(seleccion.length === mezclado.length && seleccion.every((idx2, pos2) => mezclado[idx2].correcto === pos2)){
          RoboKids.marcarLabHecho(modulo.id).catch(console.error);
          actualizarProgresoBarra();
          setTimeout(() => mostrarResultadoLab(true), 400);
        }
        pintar();
      };
    });
    pieEl.innerHTML = seleccion.length > 0
      ? `<button class="btn btn-ghost" id="btn-reiniciar-lab">${icono('retry')}Reiniciar</button>`
      : "";
    const btnReiniciar = document.getElementById("btn-reiniciar-lab");
    if(btnReiniciar) btnReiniciar.onclick = () => { seleccion = []; pintar(); };
  }

  pintar();
}

function renderLabEscenario(){
  const opciones = modulo.lab.opciones;
  let resuelto = false;

  function pintar(){
    contenidoEl.innerHTML = `
      <div class="lab-wrap">
        <div class="lab-instrucciones"><h2>${icono('flask')}${modulo.lab.titulo}</h2><p>${modulo.lab.subtitulo}</p></div>
        <div class="lab-area">
          <div class="escenario-lista" id="escenario-lista">
            ${opciones.map((op, idx) => `
              <button class="escenario-opcion" data-idx="${idx}">
                <span class="eo-icono icon-badge amarillo" style="margin:0;">${icono(op.icono)}</span>
                <span>
                  <div class="eo-titulo">${op.titulo}</div>
                  <div class="eo-texto oculto" data-texto>${op.texto}</div>
                </span>
              </button>
            `).join("")}
          </div>
        </div>
      </div>
    `;
    document.querySelectorAll(".escenario-opcion").forEach(el => {
      el.onclick = () => {
        if(resuelto) return;
        const idx = parseInt(el.dataset.idx);
        const op = opciones[idx];
        el.querySelector("[data-texto]").classList.remove("oculto");
        el.classList.add(op.correcta ? "correcta" : "incorrecta");
        if(op.correcta){
          resuelto = true;
          document.querySelectorAll(".escenario-opcion").forEach(b => b.disabled = true);
          RoboKids.marcarLabHecho(modulo.id).catch(console.error);
          actualizarProgresoBarra();
          setTimeout(() => mostrarResultadoLab(true), 900);
        }
      };
    });
    pieEl.innerHTML = "";
  }

  pintar();
}

function mostrarResultadoLab(exito, reintentar){
  contenidoEl.innerHTML = `
    <div class="quiz-wrap"><div class="quiz-resultado">
      <div class="icon-badge ${exito ? 'verde' : 'amarillo'}" style="width:64px;height:64px;border-radius:22px;">${icono(exito ? 'party' : 'help', 'style="width:32px;height:32px;"')}</div>
      <h2>${exito ? "¡Muy bien hecho!" : "Casi... ¡inténtalo de nuevo!"}</h2>
    </div></div>
  `;
  pieEl.innerHTML = exito
    ? `<button class="btn btn-verde btn-lg" id="btn-ir-quiz">Ir al Quiz${icono('clipboard')}</button>`
    : `<button class="btn btn-azul btn-lg" id="btn-reintentar">Reintentar${icono('retry')}</button>`;
  if(exito){ document.getElementById("btn-ir-quiz").onclick = () => cambiarVista("quiz"); }
  else{ document.getElementById("btn-reintentar").onclick = reintentar; }
}

/* ===========================================================
   QUIZ — pregunta, pista opcional, explicación tras responder
   =========================================================== */
function renderQuiz(){
  quizIndex = 0; quizAciertos = 0;
  pintarPregunta();
}

function pintarPregunta(){
  quizRespondida = false;
  const total = modulo.quiz.length;
  const q = modulo.quiz[quizIndex];
  contenidoEl.innerHTML = `
    <div class="quiz-wrap">
      <div style="font-weight:800;color:var(--gris-400);">Pregunta ${quizIndex+1} de ${total}</div>
      <div class="quiz-pregunta">${q.pregunta}</div>
      <button class="btn-pista" id="btn-pista">${icono('bulb')}Ver pista</button>
      <div class="pista-texto oculto" id="pista-texto">${q.pista}</div>
      <div class="quiz-opciones" id="quiz-opciones">${q.opciones.map((op,i)=>`<button class="quiz-opcion" data-idx="${i}">${op.texto}</button>`).join("")}</div>
    </div>
  `;
  document.getElementById("btn-pista").onclick = () => {
    document.getElementById("pista-texto").classList.toggle("oculto");
  };
  document.querySelectorAll(".quiz-opcion").forEach(btn => { btn.onclick = () => responder(parseInt(btn.dataset.idx), q); });
  pieEl.innerHTML = "";
}

function responder(idx, q){
  if(quizRespondida) return;
  quizRespondida = true;
  const correctaIdx = q.opciones.findIndex(o => o.correcta);
  const acerto = idx === correctaIdx;

  document.querySelectorAll(".quiz-opcion").forEach(btn => {
    btn.disabled = true;
    const i = parseInt(btn.dataset.idx);
    if(i === correctaIdx) btn.classList.add("correcta");
    else if(i === idx) btn.classList.add("incorrecta");
  });

  const cajaExplicacion = document.createElement("div");
  cajaExplicacion.className = "explicacion-caja " + (acerto ? "ok" : "");
  cajaExplicacion.textContent = q.explicacion;
  document.querySelector(".quiz-wrap").appendChild(cajaExplicacion);

  if(acerto) quizAciertos++;

  pieEl.innerHTML = `<button class="btn btn-azul btn-lg" id="btn-quiz-siguiente">Continuar</button>`;
  document.getElementById("btn-quiz-siguiente").onclick = async () => {
    quizIndex++;
    if(quizIndex < modulo.quiz.length){ pintarPregunta(); } else { await terminarQuiz(); }
  };
}

async function terminarQuiz(){
  const total = modulo.quiz.length;
  const resultado = await RoboKids.registrarQuiz(modulo.id, quizAciertos, total);
  actualizarProgresoBarra();

  const coloresConfeti = ['#58CC02','#1CB0F6','#FFC800','#FF4B4B','#CE82FF'];
  const confeti = resultado.aprobado ? Array.from({length:14}).map((_,i) => {
    const left = Math.random()*100;
    const delay = (Math.random()*0.3).toFixed(2);
    const color = coloresConfeti[i % coloresConfeti.length];
    return `<span class="confeti" style="left:${left}%; background:${color}; animation-delay:${delay}s;"></span>`;
  }).join("") : "";

  contenidoEl.innerHTML = `
    <div class="quiz-wrap confeti-wrap">
      ${confeti}
      <div class="quiz-resultado">
        <div class="icon-badge ${resultado.aprobado ? 'verde' : 'amarillo'}" style="width:64px;height:64px;border-radius:22px;">${icono(resultado.aprobado ? 'trophy' : 'trending', 'style="width:32px;height:32px;"')}</div>
        <h2>${resultado.aprobado ? "¡Lección superada!" : "¡Sigue practicando!"}</h2>
        <p style="font-weight:700;color:var(--gris-700);">Acertaste ${quizAciertos} de ${total} preguntas (${resultado.puntaje}%)</p>
      </div>
    </div>
  `;
  pieEl.innerHTML = resultado.aprobado
    ? `<button class="btn btn-verde btn-lg" id="btn-fin-ruta">Volver a mi ruta${icono('rocket')}</button>`
    : `<button class="btn btn-azul btn-lg" id="btn-fin-reintentar">Reintentar Quiz${icono('retry')}</button>`;
  if(resultado.aprobado){
    document.getElementById("btn-fin-ruta").onclick = () => { mostrarPantalla("dashboard"); initDashboard(); };
  }else{
    document.getElementById("btn-fin-reintentar").onclick = () => cambiarVista("quiz");
  }
}


/* ===========================================================
   PANTALLA: PROFESOR (login + panel con todos los estudiantes)
   =========================================================== */
document.getElementById("profesor-volver").onclick = () => mostrarPantalla("splash");

document.getElementById("profesor-entrar").onclick = async () => {
  const clave = document.getElementById("profesor-clave").value;
  const errorBox = document.getElementById("profesor-error");
  if(RoboKids.ingresarProfesor(clave)){
    errorBox.classList.add("oculto");
    document.getElementById("profesor-clave").value = "";
    mostrarPantalla("profesor-panel");
    await cargarProfesorPanel();
  }else{
    errorBox.textContent = "Contraseña incorrecta.";
    errorBox.classList.remove("oculto");
  }
};

document.getElementById("profesor-salir").onclick = () => {
  RoboKids.salirProfesor();
  mostrarPantalla("splash");
};

document.getElementById("profesor-actualizar").onclick = () => cargarProfesorPanel();

async function cargarProfesorPanel(){
  const wrap = document.getElementById("profesor-tabla-wrap");
  const resumen = document.getElementById("profesor-resumen");
  wrap.innerHTML = `<p class="profesor-empty">Cargando estudiantes...</p>`;

  let estudiantes = [];
  try{
    estudiantes = await RoboKids.listarEstudiantes();
  }catch(e){
    console.error(e);
    wrap.innerHTML = `<p class="profesor-empty">No pudimos cargar los datos. Revisa tu conexión o la configuración de Firebase.</p>`;
    return;
  }

  if(estudiantes.length === 0){
    resumen.innerHTML = "";
    wrap.innerHTML = `<p class="profesor-empty">Todavía no hay estudiantes registrados.</p>`;
    return;
  }

  const totalCompletados = estudiantes.reduce((acc, es) => {
    const c = MODULOS.filter(m => es.progreso && es.progreso[m.id] && es.progreso[m.id].completado).length;
    return acc + c;
  }, 0);
  const promedioPuntos = Math.round(estudiantes.reduce((a,e)=>a+(e.puntos||0),0) / estudiantes.length);

  resumen.innerHTML = `
    <div class="resumen-chip">${icono('users')}${estudiantes.length} estudiantes</div>
    <div class="resumen-chip">${icono('checkcircle')}${totalCompletados} temas completados en total</div>
    <div class="resumen-chip">${icono('star')}${promedioPuntos} puntos promedio</div>
  `;

  const filas = estudiantes.map(es => {
    const badges = MODULOS.map(m => {
      const p = es.progreso && es.progreso[m.id];
      let clase = "vacio", simbolo = "–";
      if(p && p.completado){ clase = "completo"; simbolo = "✓"; }
      else if(p && (p.claseVista || p.labHecho)){ clase = "progreso"; simbolo = "~"; }
      return `<span class="badge-mod ${clase}" title="${m.nombre}">${simbolo}</span>`;
    }).join("");

    return `
      <tr>
        <td><div class="estudiante-nombre"><span class="icon-badge chico">${icono(es.avatar || 'robot')}</span> ${es.nombre}</div></td>
        <td>${icono('star')}${es.puntos || 0}</td>
        <td>${icono('flame')}${es.racha || 0}</td>
        <td>${badges}</td>
      </tr>
    `;
  }).join("");

  wrap.innerHTML = `
    <table class="tabla-estudiantes">
      <thead>
        <tr>
          <th>Estudiante</th>
          <th>Puntos</th>
          <th>Racha</th>
          <th>Progreso por tema (${MODULOS.map(m=>m.icono).join(" ")})</th>
        </tr>
      </thead>
      <tbody>${filas}</tbody>
    </table>
  `;
}

/* ===========================================================
   INICIO DE LA APP
   =========================================================== */
(async () => {
  await RoboKids.init();
  if(RoboKids.usuarioActual()){
    mostrarPantalla("dashboard");
    initDashboard();
  }else{
    mostrarPantalla("splash");
  }
})();
</script>
